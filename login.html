<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AharaX Wellness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 2rem;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
            text-align: center;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .login-card:hover {
            box-shadow: 0 30px 60px rgba(30, 61, 51, 0.1);
            transform: translateY(-5px);
        }

        .role-toggle {
            display: flex;
            background: rgba(0,0,0,0.03);
            padding: 6px;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            position: relative;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .role-btn {
            flex: 1;
            padding: 0.85rem;
            border-radius: 50px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-muted);
            font-size: 0.9rem;
            z-index: 2;
        }

        .role-btn.active {
            color: white;
        }

        .role-slider {
            position: absolute;
            top: 6px;
            left: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            background: var(--primary);
            border-radius: 50px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(30, 61, 51, 0.2);
            z-index: 1;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.4rem;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(30, 61, 51, 0.04);
        }

        .login-submit {
            width: auto;
            min-width: 160px;
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            font-size: 0.95rem;
            border-radius: 50px;
        }

        .login-footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .login-footer a {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.5rem;">
                <i data-lucide="leaf"></i>
                AharaX Wellness
            </a>
            
            <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Please enter your details to sign in.</p>

            <div class="role-toggle">
                <div class="role-slider" id="roleSlider"></div>
                <button class="role-btn active" onclick="setRole('client', this)">Client</button>
                <button class="role-btn" onclick="setRole('dietitian', this)">Dietitian</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                
                <div style="text-align: right; margin-bottom: 1.5rem;">
                    <a href="#" style="font-size: 0.8rem; color: var(--primary); font-weight: 500;">Forgot Password?</a>
                </div>

                <div style="text-align: center;">
                    <button type="submit" class="cta-button login-submit">Sign In</button>
                </div>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="contact.html">Contact Us</a>
            </div>
        </div>
    </div>

    <script>
        let selectedRole = 'client';

        function setRole(role, btn) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const slider = document.getElementById('roleSlider');
            if (role === 'dietitian') {
                slider.style.transform = 'translateX(100%)';
            } else {
                slider.style.transform = 'translateX(0)';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Signing in...';
            btn.disabled = true;

            setTimeout(() => {
                if (selectedRole === 'dietitian') {
                    window.location.href = 'dietitian-dashboard.html';
                } else {
                    window.location.href = 'customer-dashboard.html';
                }
            }, 1500);
        }
        
        lucide.createIcons();
    </script>
</body>
</html>
